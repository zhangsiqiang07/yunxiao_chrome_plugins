<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 暗夜太空深色底座 (满版直角，确保全图无白色垫底) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 阿里云科技蓝极光渐变 -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- 活力珊瑚橙高能渐变 -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="45%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- 柔和空间深度阴影 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>

    <filter id="orangeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#FF5A00" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 直角充满整个画布，彻底不给外部留任何白色空间 -->
  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- 主体超级符号：云端精准捕获环 -->
  <g transform="translate(512, 512) scale(0.95) translate(-512, -512)">
    
    <!-- 蓝极光主环：云端协同闭环 -->
    <path d="
      M 512 180
      A 332 332 0 1 0 844 512
      A 72 72 0 0 0 700 512
      A 188 188 0 1 1 512 324
      A 72 72 0 0 0 512 180
      Z"
      fill="url(#blueGlow)"
      filter="url(#softGlow)"
    />

    <!-- 橙色高能焦点靶向臂：精准截图标注与直连捕获 -->
    <g filter="url(#orangeShadow)">
      <!-- 准星光环 -->
      <circle cx="512" cy="512" r="116" fill="none" stroke="url(#orangeGlow)" stroke-width="30" stroke-linecap="round" stroke-dasharray="140 42 140 42" />
      
      <!-- 准星四向微刻度线 -->
      <line x1="512" y1="358" x2="512" y2="384" stroke="url(#orangeGlow)" stroke-width="26" stroke-linecap="round" />
      <line x1="512" y1="640" x2="512" y2="666" stroke="url(#orangeGlow)" stroke-width="26" stroke-linecap="round" />
      <line x1="358" y1="512" x2="384" y2="512" stroke="url(#orangeGlow)" stroke-width="26" stroke-linecap="round" />
      <line x1="640" y1="512" x2="666" y2="512" stroke="url(#orangeGlow)" stroke-width="26" stroke-linecap="round" />

      <!-- 核心聚焦点 -->
      <circle cx="512" cy="512" r="38" fill="url(#orangeGlow)" />
      <!-- 中心发光微白点 -->
      <circle cx="512" cy="512" r="14" fill="#FFFFFF" />

      <!-- 右上方破环而出的精准定位取景标记折角 -->
      <path d="M 676 226 L 802 226 A 24 24 0 0 1 826 250 L 826 376" fill="none" stroke="url(#orangeGlow)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 右上角点睛微光 (AI Sparkle) -->
    <circle cx="766" cy="286" r="15" fill="#FFFFFF" />
  </g>
</svg>
