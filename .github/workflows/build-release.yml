name: Build & Release Chrome Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package dist into zip
        run: |
          cd dist
          zip -r ../yunxiao-bug-reporter-chrome.zip .
          cd ..
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cp yunxiao-bug-reporter-chrome.zip "yunxiao-bug-reporter-chrome-${GITHUB_REF_NAME}.zip"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunxiao-bug-reporter-chrome
          path: yunxiao-bug-reporter-chrome.zip
          retention-days: 30

      - name: Create Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yunxiao-bug-reporter-chrome.zip
            yunxiao-bug-reporter-chrome-*.zip
          generate_release_notes: true

      - name: Update Latest Pre-release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          body: |
            自动构建的最新开发版产物（基于 `main` 分支最新提交）。

            下载 `yunxiao-bug-reporter-chrome.zip` 后解压，在 Chrome 打开 `chrome://extensions/` 开启「开发者模式」，点击「加载已解压的扩展程序」选择解压后的目录即可。
          files: yunxiao-bug-reporter-chrome.zip
